<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="GenLayer Decision Origami loading spinner">
<style>
svg{overflow:visible;color:currentColor}.piece{fill:currentColor;transform-box:view-box;will-change:transform,opacity}.left{transform-origin:183px 152px;animation:fold-left var(--gl-spinner-duration,2.12s) cubic-bezier(.22,.82,.2,1) infinite}.right{transform-origin:218px 151px;animation:fold-right var(--gl-spinner-duration,2.12s) cubic-bezier(.22,.82,.2,1) infinite}.core{transform-origin:200px 245px;animation:fold-core var(--gl-spinner-duration,2.12s) cubic-bezier(.22,.82,.2,1) infinite}.crease{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-dasharray:1;opacity:0;vector-effect:non-scaling-stroke}.crease-left,.crease-right{animation:crease-wings var(--gl-spinner-duration,2.12s) ease-in-out infinite}.crease-core{animation:crease-core var(--gl-spinner-duration,2.12s) ease-in-out infinite}.exact-logo{opacity:0;animation:exact-lock var(--gl-spinner-duration,2.12s) linear infinite}.pulse{fill:none;stroke:currentColor;stroke-width:8;vector-effect:non-scaling-stroke;opacity:0;transform-box:view-box;transform-origin:200px 235px;animation:pulse var(--gl-spinner-duration,2.12s) ease-out infinite}
@keyframes fold-left{0%{transform:translate(-118px, 16px) rotate(-44deg) scaleX(.24) scaleY(.96);opacity:.16}16%{transform:translate(-72px, 10px) rotate(-24deg) scaleX(.52) scaleY(.98);opacity:.58}30%{transform:translate(-18px, 2px) rotate(-6deg) scaleX(.92) scaleY(1);opacity:1}38%, 78%{transform:translate(0,0) rotate(0deg) scaleX(1) scaleY(1);opacity:1}88%{transform:translate(-18px, 2px) rotate(-6deg) scaleX(.92) scaleY(1);opacity:1}100%{transform:translate(-118px, 16px) rotate(-44deg) scaleX(.24) scaleY(.96);opacity:.16}}
@keyframes fold-right{0%{transform:translate(118px, 16px) rotate(44deg) scaleX(.24) scaleY(.96);opacity:.16}16%{transform:translate(72px, 10px) rotate(24deg) scaleX(.52) scaleY(.98);opacity:.58}30%{transform:translate(18px, 2px) rotate(6deg) scaleX(.92) scaleY(1);opacity:1}38%, 78%{transform:translate(0,0) rotate(0deg) scaleX(1) scaleY(1);opacity:1}88%{transform:translate(18px, 2px) rotate(6deg) scaleX(.92) scaleY(1);opacity:1}100%{transform:translate(118px, 16px) rotate(44deg) scaleX(.24) scaleY(.96);opacity:.16}}
@keyframes fold-core{0%,24%{transform:translateY(124px) rotate(22deg) scaleY(.10) scaleX(.58);opacity:0}40%{transform:translateY(54px) rotate(10deg) scaleY(.42) scaleX(.82);opacity:.55}56%{transform:translateY(10px) rotate(-4deg) scaleY(1.08) scaleX(1.03);opacity:1}64%,78%{transform:translateY(0) rotate(0) scale(1);opacity:1}88%{transform:translateY(10px) rotate(-4deg) scaleY(1.08) scaleX(1.03);opacity:1}100%{transform:translateY(124px) rotate(22deg) scaleY(.10) scaleX(.58);opacity:0}}
@keyframes crease-wings{0%,6%{stroke-dashoffset:1;opacity:0}10%{opacity:.42}28%{stroke-dashoffset:0;opacity:.9}36%,100%{opacity:0}}@keyframes crease-core{0%,30%{stroke-dashoffset:1;opacity:0}38%{opacity:.42}56%{stroke-dashoffset:0;opacity:.9}64%,100%{opacity:0}}@keyframes exact-lock{0%,58%{opacity:0}64%, 80%{opacity:1}88%,100%{opacity:0}}@keyframes pulse{0%,68%{transform:scale(.48);opacity:0}74%{opacity:.62}90%{transform:scale(1.18);opacity:0}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.left,.right,.core{animation:none!important;transform:none!important;opacity:1!important}.crease,.exact-logo,.pulse{animation:none!important;opacity:0!important}}
</style>
<path class="crease crease-left" pathLength="1" d="M 102 218 L 181 154"/><path class="crease crease-right" pathLength="1" d="M 298 218 L 219 153"/><path class="crease crease-core" pathLength="1" d="M 200 334 L 200 241"/>
<polygon class="piece left" points="183,33 20,372 179,310 122,279 183,152"/><polygon class="piece right" points="218,33 218,151 280,281 222,310 382,373"/><polygon class="piece core" points="200,195 166,265 200,283 235,266"/>
<g class="exact-logo"><polygon class="piece" points="183,33 20,372 179,310 122,279 183,152"/><polygon class="piece" points="218,33 218,151 280,281 222,310 382,373"/><polygon class="piece" points="200,195 166,265 200,283 235,266"/></g><circle class="pulse" cx="200" cy="235" r="96"/>
</svg>
