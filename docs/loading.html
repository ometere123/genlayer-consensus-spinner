<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenLayer Portal — Decision Origami Loading State</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --text: #0b0b0b;
      --muted: #767676;
      --line: #e5e5e2;
      --purple: #a65df4;
      --purple-2: #8b46ed;
      --skeleton: #ececea;
      --shadow: 0 18px 55px rgba(10,10,10,.08);
    }

    body.dark {
      --bg: #090909;
      --surface: #111111;
      --surface-2: #151515;
      --text: #f6f6f4;
      --muted: #9a9a9a;
      --line: #292929;
      --skeleton: #242424;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .2s ease, color .2s ease;
    }

    .portal {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 216px minmax(0,1fr);
      grid-template-rows: 68px minmax(0,1fr);
    }

    .topbar {
      grid-column: 1 / -1;
      grid-row: 1;
      display: grid;
      grid-template-columns: 216px minmax(0,1fr);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      border-right: 1px solid var(--line);
      font-weight: 720;
      letter-spacing: -.035em;
      white-space: nowrap;
    }

    .brand svg { width: 26px; height: 26px; flex: 0 0 auto; }
    .brand span { font-size: 18px; }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 18px;
    }

    .search {
      margin-right: auto;
      width: min(360px, 38vw);
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 0 15px;
      font-size: 14px;
    }

    .submit {
      height: 40px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      background: linear-gradient(135deg, var(--purple), var(--purple-2));
      color: #fff;
      font-weight: 680;
      box-shadow: 0 8px 24px rgba(145, 73, 233, .23);
    }

    .account {
      height: 40px;
      border: 0;
      border-radius: 999px;
      padding: 0 17px;
      background: var(--text);
      color: var(--surface);
      font-weight: 680;
    }

    .sidebar {
      grid-column: 1;
      grid-row: 2;
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 14px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav-label {
      padding: 13px 12px 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .nav-item {
      min-height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 580;
    }

    .nav-item.active {
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .dot-icon {
      width: 15px;
      height: 15px;
      border: 1.7px solid currentColor;
      border-radius: 4px;
      opacity: .82;
      flex: 0 0 auto;
    }

    .sidebar-bottom { margin-top: auto; }

    .main {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      padding: 28px clamp(18px, 3vw, 42px) 54px;
      position: relative;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 40px);
      letter-spacing: -.045em;
      line-height: 1;
    }

    .page-note {
      color: var(--muted);
      font-size: 13px;
      max-width: 360px;
      text-align: right;
      line-height: 1.45;
    }

    .hero-card {
      height: 226px;
      border-radius: 18px;
      background: linear-gradient(120deg, #090909 0%, #151515 45%, #121212 100%);
      border: 1px solid #242424;
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      filter: blur(25px);
      opacity: .8;
    }

    .hero-card::before {
      right: 7%;
      top: -155px;
      background: #8249e8;
    }

    .hero-card::after {
      left: 12%;
      bottom: -210px;
      background: #e59d2f;
    }

    .hero-copy {
      position: absolute;
      inset: auto auto 28px 28px;
      width: min(430px, calc(100% - 56px));
      z-index: 2;
    }

    .hero-line, .skel {
      overflow: hidden;
      position: relative;
      background: var(--skeleton);
    }

    .hero-line { background: rgba(255,255,255,.17); border-radius: 8px; height: 17px; margin-top: 9px; }
    .hero-line.big { width: 72%; height: 30px; }
    .hero-line.mid { width: 52%; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric, .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .metric { min-height: 108px; padding: 18px; }
    .metric .skel:first-child { width: 46%; height: 28px; border-radius: 7px; }
    .metric .skel:last-child { width: 74%; height: 11px; border-radius: 6px; margin-top: 13px; }

    .content-grid {
      display: grid;
      grid-template-columns: 1.45fr .75fr;
      gap: 14px;
    }

    .card { padding: 20px; min-height: 260px; }
    .card-title { width: 38%; height: 18px; border-radius: 6px; }
    .row { display: grid; grid-template-columns: 42px 1fr 72px; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; }
    .line-a { width: 54%; height: 12px; border-radius: 6px; }
    .line-b { width: 34%; height: 9px; border-radius: 6px; margin-top: 8px; }
    .chip { width: 66px; height: 25px; border-radius: 999px; justify-self: end; }

    .skel::after, .hero-line::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
      animation: shimmer 1.55s ease-in-out infinite;
    }

    body.dark .skel::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); }

    @keyframes shimmer { to { transform: translateX(100%); } }

    .loading-layer {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: color-mix(in srgb, var(--bg) 42%, transparent);
      backdrop-filter: blur(1.5px);
    }

    .spinner-shell {
      width: 126px;
      height: 126px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .spinner {
      width: 64px;
      height: 64px;
      display: block;
    }

    body.dark .spinner { filter: invert(1); }

    .demo-controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: flex;
      gap: 8px;
    }

    .demo-controls a,
    .demo-controls button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 13px;
      background: var(--surface);
      color: var(--text);
      font: 650 12px/1 system-ui, sans-serif;
      text-decoration: none;
      box-shadow: 0 7px 24px rgba(0,0,0,.06);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .portal { grid-template-columns: 72px minmax(0,1fr); }
      .topbar { grid-template-columns: 72px minmax(0,1fr); }
      .brand { justify-content: center; padding: 0; }
      .brand span, .nav-item span, .nav-label { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .metrics { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 640px) {
      .portal { grid-template-columns: 1fr; grid-template-rows: 62px 1fr; }
      .topbar { grid-template-columns: 58px minmax(0,1fr); height: 62px; }
      .brand { border-right: 0; }
      .brand svg { width: 25px; height: 25px; }
      .sidebar { display: none; }
      .main { grid-column: 1; grid-row: 2; padding: 22px 14px 42px; }
      .search { display: none; }
      .top-actions { padding: 0 10px 0 0; gap: 7px; }
      .submit { padding: 0 12px; font-size: 12px; }
      .account { width: 40px; padding: 0; font-size: 0; }
      .account::after { content: "U"; font-size: 13px; }
      .page-head { align-items: flex-start; }
      .page-note { display: none; }
      .hero-card { height: 188px; border-radius: 14px; }
      .hero-copy { inset: auto 18px 20px 18px; width: auto; }
      .metrics { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
      .metric { min-height: 92px; padding: 14px; }
      .content-grid { grid-template-columns: 1fr; }
      .content-grid .card:last-child { display: none; }
      .spinner-shell { width: 104px; height: 104px; border-radius: 20px; }
      .spinner { width: 54px; height: 54px; }
      .demo-controls { right: 10px; bottom: 10px; }
      .demo-controls a, .demo-controls button { padding: 9px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skel::after, .hero-line::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="portal">
    <header class="topbar">
      <div class="brand" aria-label="GenLayer Portal">
        <svg viewBox="0 0 400 400" aria-hidden="true">
          <polygon fill="currentColor" points="183,33 20,372 179,310 122,279 183,152" />
          <polygon fill="currentColor" points="218,33 218,151 280,281 222,310 382,373" />
          <polygon fill="currentColor" points="200,195 166,265 200,283 235,266" />
        </svg>
        <span>GenLayerPortal</span>
      </div>
      <div class="top-actions">
        <div class="search">Search Participants...</div>
        <button class="submit" type="button">Submit a contribution</button>
        <button class="account" type="button">Participant</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="nav-item active"><i class="dot-icon"></i><span>Overview</span></div>
      <div class="nav-label">Contribute</div>
      <div class="nav-item"><i class="dot-icon"></i><span>Builders</span></div>
      <div class="nav-item"><i class="dot-icon"></i><span>Validators</span></div>
      <div class="nav-item"><i class="dot-icon"></i><span>Community</span></div>
      <div class="nav-item"><i class="dot-icon"></i><span>Stewards</span></div>
      <div class="sidebar-bottom">
        <div class="nav-item"><i class="dot-icon"></i><span>How it works</span></div>
        <div class="nav-item"><i class="dot-icon"></i><span>My submissions</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">GenLayer Portal</div>
          <h1>Overview</h1>
        </div>
        <div class="page-note">Context mockup for evaluating the Decision Origami spinner in a realistic Portal loading state.</div>
      </div>

      <section class="hero-card" aria-hidden="true">
        <div class="hero-copy">
          <div class="hero-line big"></div>
          <div class="hero-line mid"></div>
          <div class="hero-line" style="width:36%"></div>
        </div>
      </section>

      <section class="metrics" aria-hidden="true">
        <div class="metric"><div class="skel"></div><div class="skel"></div></div>
        <div class="metric"><div class="skel"></div><div class="skel"></div></div>
        <div class="metric"><div class="skel"></div><div class="skel"></div></div>
        <div class="metric"><div class="skel"></div><div class="skel"></div></div>
      </section>

      <section class="content-grid" aria-hidden="true">
        <div class="card">
          <div class="skel card-title"></div>
          <div class="row"><div class="skel avatar"></div><div><div class="skel line-a"></div><div class="skel line-b"></div></div><div class="skel chip"></div></div>
          <div class="row"><div class="skel avatar"></div><div><div class="skel line-a"></div><div class="skel line-b"></div></div><div class="skel chip"></div></div>
          <div class="row"><div class="skel avatar"></div><div><div class="skel line-a"></div><div class="skel line-b"></div></div><div class="skel chip"></div></div>
        </div>
        <div class="card">
          <div class="skel card-title" style="width:55%"></div>
          <div class="skel" style="height:120px;border-radius:14px;margin-top:24px"></div>
          <div class="skel" style="height:11px;width:70%;border-radius:6px;margin-top:18px"></div>
          <div class="skel" style="height:11px;width:48%;border-radius:6px;margin-top:10px"></div>
        </div>
      </section>

      <div class="loading-layer" role="status" aria-label="Loading">
        <div class="spinner-shell">
          <object class="spinner" data="genlayer-spinner.svg" type="image/svg+xml" aria-label="GenLayer Decision Origami loading spinner"></object>
        </div>
      </div>
    </main>
  </div>

  <div class="demo-controls" aria-label="Demo controls">
    <a href="index.html">Design demo</a>
    <button id="theme" type="button">Light / Dark</button>
  </div>

  <script>
    document.getElementById('theme').addEventListener('click', function () {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
